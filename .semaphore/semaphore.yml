version: v1.0
name: Crystal
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
blocks:
  - name: crystal spec
    task:
      env_vars:
        - name: Z3_VERSION
          value: "4.16.0"
        - name: Z3_DIST
          value: x64-glibc-2.39
        - name: CRYSTAL_VERSION
          value: "1.21"
        # The image ships an ancient system libz3 (4.8.x) in /usr/lib/x86_64-linux-gnu,
        # which cc searches before /usr/local/lib. Only an explicit -L outranks it, and
        # this env var is the one that also reaches the examples the integration specs run.
        - name: CRYSTAL_LIBRARY_PATH
          value: /usr/local/lib:/usr/lib/crystal
      jobs:
        - name: crystal spec
          commands:
            - curl -fsSLo /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-$Z3_VERSION/z3-$Z3_VERSION-$Z3_DIST.zip
            - unzip -q /tmp/z3.zip -d /tmp
            - sudo cp /tmp/z3-$Z3_VERSION-$Z3_DIST/bin/libz3.so /usr/local/lib/
            - sudo cp /tmp/z3-$Z3_VERSION-$Z3_DIST/bin/z3 /usr/local/bin/
            - sudo ldconfig
            - z3 --version
            - curl -fsSL https://crystal-lang.org/install.sh | sudo bash -s -- --version=$CRYSTAL_VERSION
            - crystal --version
            - checkout
            - crystal spec
